[project]
name = "apt-repo"
version = "0.1.0"
requires-python = ">=3.12"
description = "Token-protected APT mirror: repo-auth (Caddy forward_auth) and aptly sync"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "A", "SIM", "RUF", "PL"]

[tool.ruff.lint.pep8-naming]
# http.server dispatches to methods with exactly these names.
extend-ignore-names = ["do_GET", "do_HEAD"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["repo_auth", "repo_sync", "tests"]
