[project]
name = "apt-repo"
version = "0.1.0"
requires-python = ">=3.12"
description = "Token-protected APT mirror: repo-auth (Caddy forward_auth) and aptly sync"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "A", "SIM", "RUF", "PL"]
# Guard clauses with early returns are clearer than nesting in auth checks.
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PLR0904", "SIM117", "PLW1514", "SIM115"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["repo_auth", "repo_sync", "tests"]
