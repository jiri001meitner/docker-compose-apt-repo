name: Integration (aptly, offline)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f docker/aptly.Dockerfile -t apt-repo/aptly:test .
          docker build -t apt-repo/aptly-it:test tests/integration
      - name: repo-sync against a signed fixture repository
        run: docker run --rm --network none apt-repo/aptly-it:test
