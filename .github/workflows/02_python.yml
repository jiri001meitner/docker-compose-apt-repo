name: Python (ruff, mypy, unit tests)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install tools
        run: python -m pip install --upgrade ruff mypy pytest
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: Unit tests
        run: python -m pytest -q
