name: Security (secrets, forbidden files)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history, not only the last commit
      # The action scans only the pushed commits; the CLI scans every commit.
      - name: gitleaks over the whole history
        run: >
          docker run --rm -v "$PWD":/repo:ro zricethezav/gitleaks:latest
          git /repo --no-banner --redact --exit-code 1

  forbidden-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No configuration, keys, databases, sockets or caches tracked
        run: git ls-files -z | scripts/forbidden_files.sh
      - name: Pre-commit hook works
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git config core.hooksPath .githooks
          printf 'X=1\n' > .env
          git add -f .env
          if git commit -qm "must be refused"; then
            echo "::error::the hook accepted .env"
            exit 1
          fi
          git rm -q --cached .env
