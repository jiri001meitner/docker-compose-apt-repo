name: Compose validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with .env.ci (all profiles)
        run: docker compose --env-file .env.ci --profile tools config -q
      # Services in the `tools` profile are not built by a plain `build`.
      - name: Build all images (all profiles)
        run: docker compose --env-file .env.ci --profile tools build --pull
